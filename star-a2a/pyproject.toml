[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "star-a2a"
version = "0.1.0"
description = "Reference A2A v1 host for StarLang external actors"
requires-python = ">=3.11"
dependencies = [
  "a2a-sdk[http-server]>=1.0.3,<2",
  "httpx>=0.28,<1",
  "starlette>=0.47,<1",
  "uvicorn>=0.35,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
