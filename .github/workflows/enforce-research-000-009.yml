name: Enforce Star-Lang research 000-009

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/enforce-research-000-009.yml

permissions:
  contents: write

jobs:
  conform:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CL_SOURCE_REGISTRY: ${{ github.workspace }}//
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply approved research invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          root = Path('.')

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing patch anchor: {label}')
              return text.replace(old, new, 1)

          def camel(name):
              parts = re.split(r'[-_]', name)
              return parts[0] + ''.join(part[:1].upper() + part[1:] for part in parts[1:] if part)

          # Convert placeholder digest labels to full SHA-256 locks. Real full
          # digests are preserved. Local import digests are recomputed below.
          digest_re = re.compile(r'sha256:([A-Za-z0-9][A-Za-z0-9._:-]*)')
          for path in list(root.rglob('*.lisp')) + list(root.rglob('*.star')) + list(root.rglob('*.md')):
              text = read(path)
              def digest_repl(match):
                  payload = match.group(1)
                  if re.fullmatch(r'[0-9a-fA-F]{64}', payload):
                      return 'sha256:' + payload.lower()
                  return 'sha256:' + hashlib.sha256(payload.encode('utf-8')).hexdigest()
              updated = digest_re.sub(digest_repl, text)
              if updated != text:
                  write(path, updated)

          # Discover and migrate declared Star-Lang fields to lower camelCase.
          field_decl_re = re.compile(
              r'\(([A-Za-z][A-Za-z0-9_-]*)(?=\s+(?:\([^()]*\)|[^\s()]+)\s+:(?:required|optional)\b)'
          )
          field_map = {}
          star_files = sorted(root.rglob('*.star'))
          for path in star_files:
              text = read(path)
              def field_repl(match):
                  old = match.group(1)
                  new = camel(old)
                  if old != new:
                      field_map[old] = new
                  return '(' + new
              updated = field_decl_re.sub(field_repl, text)
              if updated != text:
                  write(path, updated)

          # Migrate field declarations embedded in trusted test strings/forms.
          for path in sorted(root.rglob('*.lisp')):
              text = read(path)
              updated = field_decl_re.sub(lambda m: '(' + camel(m.group(1)), text)
              if updated != text:
                  write(path, updated)

          # Flat :fields lists are field references (ID policies), unlike nested
          # message field declaration lists.
          flat_fields_re = re.compile(r'(:fields\s+\()([^()]*)(\))', re.S)
          def rewrite_flat_fields(match):
              body = match.group(2)
              for old, new in sorted(field_map.items(), key=lambda item: len(item[0]), reverse=True):
                  body = re.sub(r'(?<![A-Za-z0-9_-])' + re.escape(old) + r'(?![A-Za-z0-9_-])', new, body)
              return match.group(1) + body + match.group(3)
          for path in star_files:
              text = read(path)
              updated = flat_fields_re.sub(rewrite_flat_fields, text)
              if updated != text:
                  write(path, updated)

          # Exact field-key strings in runtime code and tests follow the schema.
          for path in sorted(root.rglob('*.lisp')):
              text = read(path)
              updated = text
              for old, new in sorted(field_map.items(), key=lambda item: len(item[0]), reverse=True):
                  updated = updated.replace(f'"{old}"', f'"{new}"')
                  updated = updated.replace(f'\\"{old}\\"', f'\\"{new}\\"')
              if updated != text:
                  write(path, updated)

          # Constructor binding destinations are field names. Current overlays
          # are closed trusted metadata, so migrate known field tokens there.
          constructor_fixture = Path('fixtures/star-cl-constructors.star')
          if constructor_fixture.exists():
              text = read(constructor_fixture)
              for old, new in sorted(field_map.items(), key=lambda item: len(item[0]), reverse=True):
                  text = re.sub(r'(\()' + re.escape(old) + r'(?=\s)', r'\1' + new, text)
              write(constructor_fixture, text)

          # Research 006 canonical relation positions are source/predicate/destination.
          for path in star_files:
              text = read(path)
              text = text.replace('(target document-id :required)', '(destination document-id :required)')
              text = text.replace(':fields (source target predicate)', ':fields (source destination predicate)')
              write(path, text)

          text = read('fixtures/star-cl-constructors.star')
          text = text.replace(
              ':lambda-list (dataset source target &key note (predicate "related-to"))',
              ':lambda-list (dataset source destination &key note (predicate "related-to"))')
          text = text.replace('(target target)', '(destination destination)')
          write('fixtures/star-cl-constructors.star', text)

          # Research 009 numeric split: geo is approximate float; exact decimal remains string encoded.
          for path in (Path('fixtures/star-cl.star'), Path('fixtures/starintel-core.star')):
              text = read(path)
              text = re.sub(r'(\(scalar latitude\s+\(:base) decimal', r'\1 float', text)
              text = re.sub(r'(\(scalar longitude\s+\(:base) decimal', r'\1 float', text)
              text = text.replace('(alt decimal :optional)', '(alt float :optional)')
              text = text.replace('(accuracy decimal :optional)', '(accuracy float :optional)')
              write(path, text)

          # Recompute every local :path import digest after fixture migrations.
          import_re = re.compile(
              r'(\(import\s+"[^"]+".*?:digest\s+")sha256:[0-9a-fA-F]{64}(".*?:path\s+")([^"]+)(".*?\))',
              re.S,
          )
          for _ in range(8):
              changed = False
              for path in star_files:
                  text = read(path)
                  def import_repl(match):
                      nonlocal_changed = False
                      target = (path.parent / match.group(3)).resolve()
                      if not target.exists():
                          return match.group(0)
                      digest = hashlib.sha256(target.read_bytes()).hexdigest()
                      return match.group(1) + 'sha256:' + digest + match.group(2) + match.group(3) + match.group(4)
                  updated = import_re.sub(import_repl, text)
                  if updated != text:
                      write(path, updated)
                      changed = True
              if not changed:
                  break

          # Core parser/compiler: preserve source field spelling, enforce lower
          # camelCase, add resource limits, float, and full digest validation.
          path = Path('prototype/core-surface-prototype.lisp')
          text = read(path)
          text = replace_once(
              text,
              '(defvar *star-source-positions* nil)\n',
              '(defvar *star-source-positions* nil)\n\n'
              '(defparameter *maximum-star-source-characters* (* 16 1024 1024))\n'
              '(defparameter *maximum-star-source-depth* 128)\n'
              '(defparameter *maximum-star-source-nodes* 100000)\n'
              '(defparameter *maximum-star-token-length* 4096)\n'
              '(defparameter *maximum-star-integer-digits* 256)\n',
              'core parser limits')
          text = replace_once(
              text,
              '  (column 1 :type fixnum)\n  (positions (make-hash-table :test #\'eq)))',
              '  (column 1 :type fixnum)\n  (nodes 0 :type fixnum)\n  (positions (make-hash-table :test #\'eq)))',
              'parser node counter')

          # Generate the closed keyword vocabulary from the checked-in .star corpus.
          keywords = set()
          for fixture in star_files:
              keywords.update(re.findall(r':([A-Za-z][A-Za-z0-9-]*)', read(fixture)))
          keywords.update({
              'accepts', 'actor', 'capabilities', 'endpoint', 'handler', 'mailbox',
              'produces', 'protocol', 'restart', 'runtime', 'kind', 'prefix',
              'export', 'or', 'email-user', 'email-domain'
          })
          keyword_block = '(defparameter *star-source-keywords*\n  \'(' + '\n'.join(
              f'("{name}" . :{name})' for name in sorted(keywords)
          ) + '))\n\n'
          start = text.index('(defparameter *star-source-keywords*')
          end = text.index('(defun star-source-end-p', start)
          text = text[:start] + keyword_block + text[end:]

          old_integer = '''(defun star-source-integer (token)
  (when (and (> (length token) 0)
             (or (every #'digit-char-p token)
                 (and (> (length token) 1)
                      (find (char token 0) '(#\\+ #\\-))
                      (every #'digit-char-p (subseq token 1)))))
    (parse-integer token)))'''
          new_integer = '''(defun star-source-integer (token parser)
  (when (and (> (length token) 0)
             (or (every #'digit-char-p token)
                 (and (> (length token) 1)
                      (find (char token 0) '(#\\+ #\\-))
                      (every #'digit-char-p (subseq token 1)))))
    (let ((digits (if (find (char token 0) '(#\\+ #\\-))
                      (1- (length token))
                      (length token))))
      (when (> digits *maximum-star-integer-digits*)
        (fail-star-source parser
                          "Integer literal exceeds the ~D-digit limit."
                          *maximum-star-integer-digits*)))
    (parse-integer token)))'''
          text = replace_once(text, old_integer, new_integer, 'bounded integer parser')
          text = replace_once(
              text,
              '             (advance-star-source parser))\n    (let* ((token',
              '             (advance-star-source parser)\n             (when (> (- (star-source-parser-index parser) start)\n                      *maximum-star-token-length*)\n               (fail-star-source parser\n                                 "Token exceeds the ~D-character limit."\n                                 *maximum-star-token-length*)))\n    (let* ((token',
              'token length guard')
          text = text.replace('(integer (star-source-integer token)))',
                              '(integer (star-source-integer token parser))')
          text = replace_once(text, '(t\n         (string-downcase token))))))',
                              '(t token)))))', 'preserve source token spelling')
          text = replace_once(
              text,
              '(defun parse-star-source-value (parser)\n  (skip-star-source-trivia parser)',
              '(defun parse-star-source-value (parser &optional (depth 0))\n'
              '  (incf (star-source-parser-nodes parser))\n'
              '  (when (> (star-source-parser-nodes parser) *maximum-star-source-nodes*)\n'
              '    (fail-star-source parser\n'
              '                      "Star source exceeds the ~D-node limit."\n'
              '                      *maximum-star-source-nodes*))\n'
              '  (skip-star-source-trivia parser)',
              'parser node limit')
          text = replace_once(
              text,
              '      ((char= character #\\()\n       (let ((line',
              '      ((char= character #\\()\n'
              '       (when (>= depth *maximum-star-source-depth*)\n'
              '         (fail-star-source parser\n'
              '                           "Star source exceeds the ~D-level nesting limit."\n'
              '                           *maximum-star-source-depth*))\n'
              '       (let ((line',
              'parser depth limit')
          text = text.replace('(push (parse-star-source-value parser) values)',
                              '(push (parse-star-source-value parser (1+ depth)) values)')
          text = replace_once(
              text,
              '(defun parse-star-source (source pathname)\n  (let ((parser (make-star-source-parser source pathname)))',
              '(defun parse-star-source (source pathname)\n'
              '  (let ((parser (make-star-source-parser source pathname)))\n'
              '    (when (> (length source) *maximum-star-source-characters*)\n'
              '      (fail-star-source parser\n'
              '                        "Star source exceeds the ~D-character limit."\n'
              '                        *maximum-star-source-characters*))',
              'source size limit')
          old_digest = '''(defun digest-p (value)
  (and (stringp value)
       (> (length value) 7)
       (string= "sha256:" value :end2 7)))'''
          new_digest = '''(defun digest-p (value)
  (and (stringp value)
       (= (length value) 71)
       (string= "sha256:" value :end2 7)
       (every (lambda (character)
                (or (digit-char-p character)
                    (find character "abcdefABCDEF")))
              (subseq value 7))))'''
          text = replace_once(text, old_digest, new_digest, 'full core digest')
          text = text.replace('"decimal" "integer"', '"decimal" "float" "integer"')

          field_helpers = '''(defun camelize-field-token (value)
  (with-output-to-string (stream)
    (loop with uppercase-next = nil
          for character across value
          do (cond
               ((find character "-_")
                (setf uppercase-next t))
               (uppercase-next
                (write-char (char-upcase character) stream)
                (setf uppercase-next nil))
               (t (write-char character stream))))))

(defun field-identifier-string (value)
  (etypecase value
    (string value)
    (symbol (camelize-field-token (string-downcase (symbol-name value))))))

(defun lower-camel-field-name-p (value)
  (and (stringp value)
       (> (length value) 0)
       (lower-case-p (char value 0))
       (every (lambda (character)
                (or (alpha-char-p character)
                    (digit-char-p character)))
              value)
       (notany (lambda (character) (find character "-_")) value)))

'''
          marker = '(defun compile-field (field library-name local-types)'
          if marker not in text:
              raise SystemExit('missing compile-field marker')
          text = text.replace(marker, field_helpers + marker, 1)
          old_compile_field = '''(defun compile-field (field library-name local-types)
  (with-star-source-position (field)
    (unless (and (listp field) (>= (length field) 3))
      (fail 'invalid-field-error "Invalid field declaration ~S." field))
    (destructuring-bind (name type &rest options) field
      (multiple-value-bind (required-p default default-p)
          (parse-field-markers options name)
        (when (and required-p default-p)
          (fail 'invalid-field-error
                "Required field ~A cannot declare a default."
                name))
        (list :name (identifier-string name)
              :type (normalize-type-expression type library-name local-types)
              :required required-p
              :default-p default-p
              :default default)))))'''
          new_compile_field = '''(defun compile-field (field library-name local-types)
  (with-star-source-position (field)
    (unless (and (listp field) (>= (length field) 3))
      (fail 'invalid-field-error "Invalid field declaration ~S." field))
    (destructuring-bind (name type &rest options) field
      (let ((field-name (field-identifier-string name)))
        (unless (lower-camel-field-name-p field-name)
          (fail 'invalid-field-error
                "Field ~A must use lower camelCase without hyphens or underscores."
                field-name))
        (multiple-value-bind (required-p default default-p)
            (parse-field-markers options field-name)
          (when (and required-p default-p)
            (fail 'invalid-field-error
                  "Required field ~A cannot declare a default."
                  field-name))
          (list :name field-name
                :type (normalize-type-expression type library-name local-types)
                :required required-p
                :default-p default-p
                :default default))))))'''
          text = replace_once(text, old_compile_field, new_compile_field, 'camelCase field compiler')
          write(path, text)

          # Loader: the Common Lisp reader is no longer used for .star source.
          path = Path('prototype/star-loader.lisp')
          text = read(path)
          text = replace_once(
              text,
              '''(defun url-p (value)
  (or (string-prefix-p "https://" value)
      (string-prefix-p "http://" value)))''',
              '''(defun url-p (value)
  (and (stringp value)
       (string-prefix-p "https://" value)))''',
              'HTTPS-only URL policy')
          old_reader = '''(defun read-star-source (source source-name)
  (let ((*read-eval* nil)
        (*package* (find-package "STAR-LANG.LOADER"))
        (*readtable* (copy-readtable nil)))
    (set-macro-character #\\# #'rejecting-sharp-reader nil *readtable*)
    (with-input-from-string (stream source)
      (let ((form (read stream nil :eof)))
        (when (eq form :eof)
          (fail-loader 'source-error "Star source ~A is empty." source-name))
        (unless (eq (read stream nil :eof) :eof)
          (fail-loader 'source-error
                       "Star source ~A must contain exactly one top-level form."
                       source-name))
        (validate-source-tree form)))))'''
          new_reader = '''(defun read-star-source (source source-name)
  (handler-case
      (multiple-value-bind (form positions)
          (star-lang.core-surface.prototype::parse-star-source source source-name)
        (declare (ignore positions))
        (validate-source-tree form))
    (star-lang.core-surface.prototype:star-lang-source-error (condition)
      (fail-loader 'source-error "~A" condition))))'''
          text = replace_once(text, old_reader, new_reader, 'closed loader parser')
          text = replace_once(
              text,
              '''(defun declaration-kind (form)
  (unless (and (consp form) (symbolp (first form)))
    (fail-loader 'source-error "Invalid Star declaration ~S." form))
  (identifier-string (first form)))''',
              '''(defun declaration-kind (form)
  (unless (and (consp form)
               (or (symbolp (first form))
                   (stringp (first form))))
    (fail-loader 'source-error "Invalid Star declaration ~S." form))
  (identifier-string (first form)))''',
              'string declaration operators')
          text = text.replace('"Import URL ~S must use http:// or https://."',
                              '"Import URL ~S must use https://."')
          text = text.replace('"--proto" "=http,https"',
                              '"--proto" "=https"\n                  "--proto-redir" "=https"')
          write(path, text)

          # Canonical JSON: lower camelCase keys and finite binary64 support.
          path = Path('prototype/canonical-json-prototype.lisp')
          text = read(path)
          old_json_key = '''(defun json-key-name (key)
  (substitute #\\_ #\\-
              (string-downcase
               (etypecase key
                 (keyword (symbol-name key))
                 (symbol (symbol-name key))
                 (string key)))))'''
          new_json_key = '''(defun lower-camel-json-name (value)
  (with-output-to-string (stream)
    (loop with uppercase-next = nil
          for character across (string-downcase value)
          do (cond
               ((find character "-_")
                (setf uppercase-next t))
               (uppercase-next
                (write-char (char-upcase character) stream)
                (setf uppercase-next nil))
               (t (write-char character stream))))))

(defun json-key-name (key)
  (etypecase key
    (string key)
    (keyword (lower-camel-json-name (symbol-name key)))
    (symbol (lower-camel-json-name (symbol-name key)))))'''
          text = replace_once(text, old_json_key, new_json_key, 'camel JSON keys')
          text = replace_once(
              text,
              '''    ((keyword-plist-p payload)
     (let ((key (intern (string-upcase field-name) :keyword)))
       (when (plist-has-key-p payload key)
         (cons field-name (getf payload key)))))''',
              '''    ((keyword-plist-p payload)
     (loop for (key item) on payload by #'cddr
           when (string= (json-key-name key) field-name)
             do (return (cons field-name item))))''',
              'payload camel key lookup')
          text = text.replace('collect (identifier-string (first tail))))',
                              'collect (json-key-name (first tail))))')

          float_helpers = '''(defun finite-float-p (value)
  (and (floatp value)
       #+sbcl
       (not (or (sb-ext:float-nan-p value)
                (sb-ext:float-infinity-p value)))
       #-sbcl
       (= value value)))

(defun trim-float-mantissa (value)
  (let ((dot (position #\\. value)))
    (if (null dot)
        value
        (let ((end (length value)))
          (loop while (and (> end (1+ dot))
                           (char= (char value (1- end)) #\\0))
                do (decf end))
          (when (= end (1+ dot))
            (decf end))
          (subseq value 0 end)))))

(defun canonical-float-string (value)
  (unless (finite-float-p value)
    (fail 'invalid-envelope-error
          "Canonical JSON float must be finite, received ~S." value))
  (if (zerop value)
      "0"
      (let* ((*read-default-float-format* 'double-float)
             (*print-readably* t)
             (*print-pretty* nil)
             (raw (string-downcase
                   (write-to-string (coerce value 'double-float))))
             (token (substitute #\\e #\\d
                                (substitute #\\e #\\f raw)))
             (exponent-position (position #\\e token))
             (mantissa (trim-float-mantissa
                        (if exponent-position
                            (subseq token 0 exponent-position)
                            token))))
        (if exponent-position
            (let ((exponent
                    (parse-integer token :start (1+ exponent-position))))
              (if (zerop exponent)
                  mantissa
                  (format nil "~Ae~D" mantissa exponent)))
            mantissa))))

'''
          marker = '(defun write-canonical-json (value stream)'
          text = text.replace(marker, float_helpers + marker, 1)
          text = text.replace('    ((integerp value) value)\n    ((keywordp value)',
                              '    ((integerp value) value)\n    ((floatp value)\n     (unless (finite-float-p value)\n       (fail \'invalid-envelope-error "Non-finite manifest float ~S." value))\n     (coerce value \'double-float))\n    ((keywordp value)')
          text = text.replace('    ((integerp value) (format stream "~D" value))\n    ((json-array-p value)',
                              '    ((integerp value) (format stream "~D" value))\n    ((floatp value) (write-string (canonical-float-string value) stream))\n    ((json-array-p value)')
          text = text.replace('    ((integerp value) value)\n    ((symbolp value)',
                              '    ((integerp value) value)\n    ((floatp value)\n     (unless (finite-float-p value)\n       (fail \'invalid-envelope-error "Unsupported non-finite wire float ~S." value))\n     (coerce value \'double-float))\n    ((symbolp value)', 1)
          text = replace_once(
              text,
              '''    ((string= type "integer")
     (unless (integerp value)
       (fail 'invalid-envelope-error "~A requires an integer." context))
     value)
    ((string= type "boolean")''',
              '''    ((string= type "integer")
     (unless (integerp value)
       (fail 'invalid-envelope-error "~A requires an integer." context))
     value)
    ((string= type "float")
     (unless (floatp value)
       (fail 'invalid-envelope-error "~A requires a binary64 float." context))
     (let ((double (coerce value 'double-float)))
       (unless (finite-float-p double)
         (fail 'invalid-envelope-error "~A requires a finite float." context))
       double))
    ((string= type "boolean")''',
              'wire float validation')
          text = text.replace('(cons "star_version" 1)', '(cons "starVersion" 1)')
          text = text.replace('(cons "message_type" message-type)', '(cons "messageType" message-type)')
          text = text.replace('(cons "message_id" (getf envelope :message-id))',
                              '(cons "messageId" (getf envelope :message-id))')
          text = text.replace('(push (cons "reply_to" (getf envelope :reply-to)) entries)',
                              '(push (cons "replyTo" (getf envelope :reply-to)) entries)')
          write(path, text)

          # Generated boundary bindings consume the same float/decimal model.
          path = Path('prototype/binding-generator-prototype.lisp')
          text = read(path)
          text = text.replace('    ((string= type "integer") "int")',
                              '    ((string= type "integer") "int")\n    ((string= type "float") "float")')
          text = text.replace('    ((string= type "integer") "number")',
                              '    ((member type \'("integer" "float") :test #\'string=) "number")')
          write(path, text)

          # Document runtime preserves exact field spelling and canonical relation positions.
          path = Path('prototype/document-runtime.lisp')
          text = read(path)
          helper = '''(defun camelize-field-key (value)
  (with-output-to-string (stream)
    (loop with uppercase-next = nil
          for character across value
          do (cond
               ((find character "-_")
                (setf uppercase-next t))
               (uppercase-next
                (write-char (char-upcase character) stream)
                (setf uppercase-next nil))
               (t (write-char character stream))))))

(defun field-key-string (value)
  (camelize-field-key
   (etypecase value
     (string value)
     (symbol (string-downcase (symbol-name value))))))

'''
          marker = '(defun plist-key-present-p (plist key)'
          text = text.replace(marker, helper + marker, 1)
          text = text.replace('(cons (identifier-string key) item)',
                              '(cons (field-key-string key) item)')
          text = text.replace('(cons (identifier-string (car entry)) (cdr entry))',
                              '(cons (field-key-string (car entry)) (cdr entry))')
          text = text.replace('(cons (identifier-string key) item)))',
                              '(cons (field-key-string key) item)))')
          text = text.replace('(assoc (identifier-string key) values :test #\'string=)',
                              '(assoc (field-key-string key) values :test #\'string=)')
