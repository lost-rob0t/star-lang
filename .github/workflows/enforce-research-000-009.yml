    (loop with uppercase-next = nil
          for character across value
          do (cond
               ((find character "-_")
                (setf uppercase-next t))
               (uppercase-next
                (write-char (char-upcase character) stream)
                (setf uppercase-next nil))
               (t (write-char character stream))))))

(defun field-key-string (value)
  (camelize-field-key
   (etypecase value
     (string value)
     (symbol (string-downcase (symbol-name value))))))

'''
          marker = '(defun plist-key-present-p (plist key)'
          text = text.replace(marker, helper + marker, 1)
          old_lambda_keyword = '''(defun lambda-list-keyword-p (symbol)
  (and (symbolp symbol)
       (member symbol +lambda-list-keywords+ :test #'eq)))'''
          new_lambda_keyword = '''(defun lambda-list-keyword-p (value)
  (let ((name
          (etypecase value
            (symbol (string-downcase (symbol-name value)))
            (string (string-downcase value)))))
    (member name
            '("&optional" "&rest" "&key" "&allow-other-keys"
              "&aux" "&body" "&whole" "&environment")
            :test #'string=)))

(defun lambda-list-keyword-symbol (value)
  (or (find-symbol
       (string-upcase
        (etypecase value
          (symbol (symbol-name value))
          (string value)))
       "COMMON-LISP")
      (fail-constructor "Unknown lambda-list keyword ~S." value)))'''
          text = replace_once(text, old_lambda_keyword, new_lambda_keyword, 'string lambda keywords')
          text = text.replace('    ((symbolp parameter)\n     (unless (lambda-list-keyword-p parameter)\n       parameter))',
                              '    (((lambda (value) (or (symbolp value) (stringp value))) parameter)\n     (unless (lambda-list-keyword-p parameter)\n       parameter))')
          text = text.replace('((and (consp parameter) (symbolp (first parameter)))',
                              '((and (consp parameter)\n          (or (symbolp (first parameter)) (stringp (first parameter))))')
          text = text.replace('    ((symbolp source)\n     (if (or (null source) (eq source t))',
                              '    (((lambda (value) (or (symbolp value) (stringp value))) source)\n     (if (or (null source) (eq source t))')
          text = text.replace('(let ((field (identifier-string (first binding)))',
                              '(let ((field (field-key-string (first binding)))')
          old_relocate = '''    ((symbolp item)
     (if (lambda-list-keyword-p item)
         item
         (target-symbol item package)))'''
          new_relocate = '''    ((or (symbolp item) (stringp item))
     (if (lambda-list-keyword-p item)
         (lambda-list-keyword-symbol item)
         (target-symbol item package)))'''
          text = replace_once(text, old_relocate, new_relocate, 'relocate parsed identifiers')
          text = text.replace('    ((symbolp source) (target-symbol source package))',
                              '    ((or (symbolp source) (stringp source))\n     (target-symbol source package))')
          text = text.replace('(cons (identifier-string key) item)',
                              '(cons (field-key-string key) item)')
          text = text.replace('(cons (identifier-string (car entry)) (cdr entry))',
                              '(cons (field-key-string (car entry)) (cdr entry))')
          write(path, text)

          # Full digest validation in the retained comparative prototypes.
          for filename in ('prototype/compiler-ir-prototype.lisp',
                           'prototype/spec-domain-prototype.lisp'):
