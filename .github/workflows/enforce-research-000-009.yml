        failures.append(f'core compiler missing {required}')

for path in (Path('fixtures/star-cl.star'), Path('fixtures/starintel-core.star')):
    text = path.read_text(encoding='utf-8')
    if '(target document-id :required)' in text:
        failures.append(f'{path}: relation still uses target')
