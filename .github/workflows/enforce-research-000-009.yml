canonical = Path('prototype/canonical-json-prototype.lisp').read_text(encoding='utf-8')
for forbidden in ('star_version', 'message_type', 'message_id', 'reply_to'):
    if forbidden in canonical:
        failures.append(f'canonical JSON retains snake_case key {forbidden}')
for required in ('"starVersion"', '"messageType"', '"messageId"', '"replyTo"', '(string= type "float")'):
    if required not in canonical:
        failures.append(f'canonical JSON missing {required}')

core = Path('prototype/core-surface-prototype.lisp').read_text(encoding='utf-8')
for required in ('lower-camel-field-name-p', '"decimal" "float" "integer"', '*maximum-star-source-depth*'):
