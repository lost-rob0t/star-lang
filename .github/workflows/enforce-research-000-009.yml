        failures.append(f'{path}: latitude is not float')
    if not re.search(r'\\(scalar longitude\\s+\\(:base float', text):
        failures.append(f'{path}: longitude is not float')

if failures:
    raise SystemExit('\\n'.join(failures))
print('STAR-LANG-RESEARCH-000..009 static conformance checks passed')
