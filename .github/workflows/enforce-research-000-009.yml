              text = read(path)
              pattern = re.compile(
                  r'\(defun digest-p \((?:value|digest)\)\n'
                  r'  \(and \(stringp (?:value|digest)\)\n'
                  r'       \(> \(length (?:value|digest)\) 7\)\n'
                  r'       \(string-prefix-p "sha256:" (?:value|digest)\)\)\)'
              )
              name = 'value' if '(defun digest-p (value)' in text else 'digest'
              replacement = f'''(defun digest-p ({name})
  (and (stringp {name})
       (= (length {name}) 71)
       (string-prefix-p "sha256:" {name})
       (every (lambda (character)
                (or (digit-char-p character)
                    (find character "abcdefABCDEF")))
              (subseq {name} 7))))'''
              updated, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'could not harden digest in {filename}')
              write(path, updated)

          # Update expected canonical JSON names and canonical relation assertion.
          for path in sorted(root.rglob('*.lisp')):
              text = read(path)
              replacements = {
                  'wire_version': 'wireVersion',
                  'star_version': 'starVersion',
                  'message_type': 'messageType',
                  'message_id': 'messageId',
                  'reply_to': 'replyTo',
              }
              for old, new in replacements.items():
                  text = text.replace(old, new)
              write(path, text)

          path = Path('prototype/document-runtime-tests.lisp')
          text = read(path)
          text = text.replace('(document-value relation "target")',
                              '(document-value relation "destination")')
          text = text.replace('"relation target"', '"relation destination"')
          write(path, text)

