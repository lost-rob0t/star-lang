set -euo pipefail

python3 - <<'PY2'
from pathlib import Path
import re

failures = []
field_re = re.compile(r'\\(([A-Za-z][A-Za-z0-9_-]*[-_][A-Za-z0-9_-]*)(?=\\s+(?:\\([^()]*\\)|[^\\s()]+)\\s+:(?:required|optional)\\b)')
