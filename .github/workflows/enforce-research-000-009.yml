              text,
              '''(defun declaration-kind (declaration)
  (and (consp declaration)
       (symbolp (first declaration))
       (identifier-string (first declaration))))''',
              '''(defun declaration-kind (declaration)
  (and (consp declaration)
       (or (symbolp (first declaration))
           (stringp (first declaration)))
       (identifier-string (first declaration))))''',
              'document runtime string declarations')
          text = text.replace('    ((string= type "decimal") (numberp value))',
                              '    ((string= type "decimal") (or (stringp value) (rationalp value)))\n    ((string= type "float") (floatp value))')
          text = text.replace('"schemaVersion"', '"schemaVersion"')
          # Exact metadata fields were already migrated through field_map.
