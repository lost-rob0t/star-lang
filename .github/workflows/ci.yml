name: star-lang CI

on:
  pull_request:
    paths:
      - "ci/**"
      - "fixtures/**"
      - "star-*/**"
      - "starlang-*/**"
      - "**/*.asd"
      - "**/*.lisp"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/ci.yml"
      - "README.md"
      - "AGENTS.md"
  push:
    branches: [main]
    paths:
      - "ci/**"
      - "star-*/**"
      - "starlang-*/**"
      - "**/*.asd"
      - "**/*.lisp"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: SBCL final-system contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: Enforce static authority boundaries
        shell: bash
        run: |
          set -euo pipefail
          bash ci/check-repository-contracts.sh
          bash ci/check-final-authority.sh

      - name: Load every target system independently
        shell: bash
        run: |
          set -euo pipefail
          nix develop --command bash -lc '
            set -euo pipefail
            while IFS= read -r target_system; do
              [ -n "$target_system" ] || continue
              echo "Loading $target_system"
              sbcl --non-interactive \
                --eval "(require :asdf)" \
                --eval "(asdf:load-system :$target_system)" \
                --eval "(assert (null (find-package \"STAR-LANG.PROTOTYPE\")))" \
                --eval "(sb-ext:quit)"
            done < ci/target-systems.txt
          '

      - name: Test final compiler, loader, binding, runtime and CLI
        shell: bash
        run: |
          set -euo pipefail
          nix develop --command bash -lc '
            set -euo pipefail
            for system in starlang-compiler starlang-loader star-sento-compat starlang-runtime starlang-cli; do
              echo "Testing $system"
              sbcl --non-interactive \
                --eval "(require :asdf)" \
                --eval "(asdf:test-system :$system)" \
                --eval "(assert (null (find-package \"STAR-LANG.PROTOTYPE\")))" \
                --eval "(sb-ext:quit)"
            done
          '

      - name: Fresh-process final CLI proof
        shell: bash
        run: |
          set -euo pipefail
          nix develop --command bash -lc '
            set -euo pipefail
            sbcl --non-interactive --load starlang-cli/tests/cli-proof.lisp
            cache="$TMPDIR/starlang-cache"
            mkdir -p "$cache"
            sbcl --script starlang-cli/starlang-cli.lisp load fixtures/star-cl.star --cache "$cache"
          '

      - name: Test portable protocol boundaries
        shell: bash
        run: |
          set -euo pipefail
          nix develop --command bash -lc '
            set -euo pipefail
            sbcl --non-interactive \
              --eval "(require :asdf)" \
              --eval "(asdf:test-system :star-actor-protocol)" \
              --eval "(asdf:test-system :star-canonical-json)" \
              --eval "(asdf:test-system :star-journal)" \
              --eval "(asdf:test-system :star-lease)" \
              --eval "(asdf:test-system :star-mailbox)" \
              --eval "(asdf:test-system :star-http-port)" \
              --eval "(asdf:test-system :star-scrape)" \
              --eval "(asdf:test-system :star-logic-protocol)" \
              --eval "(asdf:test-system :star-logic-ir)" \
              --eval "(assert (null (find-package \"STAR-LANG.PROTOTYPE\")))" \
              --eval "(sb-ext:quit)"
          '
