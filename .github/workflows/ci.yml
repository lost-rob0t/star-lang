name: star-lang CI

on:
  pull_request:
    paths:
      - "prototype/**"
      - "fixtures/**"
      - "ci/**"
      - "**/*.asd"
      - "**/*.lisp"
      - "flake.nix"
      - ".github/workflows/ci.yml"
      - "README.md"
      - "SECURITY.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
  push:
    branches:
      - main
    paths:
      - "prototype/**"
      - "fixtures/**"
      - "ci/**"
      - "**/*.asd"
      - "**/*.lisp"
      - "flake.nix"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: SBCL ASDF contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CL_SOURCE_REGISTRY: ${{ github.workspace }}//
    steps:
      - uses: actions/checkout@v4

      - name: Enforce Common Lisp-only implementation boundary
        shell: bash
        run: |
          set -euo pipefail
          forbidden=""
          while IFS= read -r -d '' f; do
            forbidden="$forbidden $f"
          done < <(find . -path ./.git -prune -o -type f \( -name '*.rkt' -o -name '*.scm' -o -name '*.ss' -o -name '*.py' \) -print)
          if [ -n "$forbidden" ]; then
            echo "Forbidden non-Common-Lisp implementation files found:$forbidden"
            exit 1
          fi

      - name: Install SBCL
        run: |
          sudo apt-get update
          sudo apt-get install --yes sbcl

      - name: Load starlang-prototype ASDF system
        shell: bash
        run: |
          set -euo pipefail
          sbcl --non-interactive \
            --eval '(require :asdf)' \
            --eval '(asdf:load-system :starlang-prototype)' \
            --eval '(format t "~&starlang-prototype ASDF system loaded OK~%")' \
            --eval '(sb-ext:quit)'

      - name: Load target ASDF systems independently
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r target_system; do
            [ -n "$target_system" ] || continue
            echo "Loading $target_system"
            sbcl --non-interactive \
              --eval '(require :asdf)' \
              --eval "(asdf:load-system :$target_system)" \
              --eval '(sb-ext:quit)'
          done < ci/target-systems.txt

      - name: Run starlang-prototype ASDF test system
        shell: bash
        run: |
          set -euo pipefail
          sbcl --non-interactive \
            --eval '(require :asdf)' \
            --eval '(asdf:test-system :starlang-prototype)' \
            --eval '(sb-ext:quit)' \
            2>&1 | tee star-lang-asdf-tests.log

      - name: Validate generated interchange artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import py_compile
          from pathlib import Path

          for name in ("star-lang-fec-manifest.json", "star-lang-fec-envelope.json"):
              path = Path(name)
              if not path.is_file():
                  raise SystemExit(f"missing generated JSON artifact: {path}")
              json.loads(path.read_text(encoding="utf-8"))

          lifecycle = sorted(Path(".").glob("star-lang-lifecycle-*.json"))
          if not lifecycle:
              raise SystemExit("no message lifecycle JSON artifacts were produced")
          for path in lifecycle:
              json.loads(path.read_text(encoding="utf-8"))

          for pattern in ("star-lang-dispatch-*.ndjson", "star-lang-transport-*.ndjson"):
              files = sorted(Path(".").glob(pattern))
              if not files:
                  raise SystemExit(f"no artifacts matched {pattern}")
              for path in files:
                  lines = path.read_text(encoding="utf-8").splitlines()
                  if not lines:
                      raise SystemExit(f"{path} is empty")
                  for line in lines:
                      json.loads(line)

          for name in ("star_lang_fec.py", "star_protocol.py"):
              path = Path(name)
              if not path.is_file():
                  raise SystemExit(f"missing generated Python binding: {path}")
              py_compile.compile(str(path), doraise=True)
          PY

      - name: Upload test logs and generated artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: star-lang-test-logs
          path: |
            star-lang-*.log
            star-lang-*.json
            star-lang-*.ndjson
            star_lang_*.py
            star_lang_*.ts
            star_protocol.py
            star_protocol.ts
          if-no-files-found: warn
