name: StarIntel release generator

on:
  pull_request:
    paths:
      - "specs/starintel/**"
      - "tools/generate-starintel-release.lisp"
      - "tools/finalize-starintel-release.py"
      - ".github/workflows/starintel-release-preview.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  generate:
    name: Generate StarIntel release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      CL_SOURCE_REGISTRY: "${{ github.workspace }}//:"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Install generator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            sbcl \
            cl-babel \
            cl-fiveam \
            cl-ironclad \
            cl-usocket \
            cl-yason

      - name: Generate and finalize StarIntel 0.10.1
        shell: bash
        run: |
          set -euo pipefail
          sbcl --disable-debugger \
            --script tools/generate-starintel-release.lisp
          python3 tools/finalize-starintel-release.py
          sbcl --disable-debugger \
            --script tools/generate-starintel-release.lisp --check
          python3 tools/finalize-starintel-release.py --check

      - name: Commit generated release on same-repository PRs
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            specs/starintel/0.10.1/generated \
            specs/starintel/0.10.1/release-lock.json \
            specs/starintel/0.10.1/schema-lock-manifest.json; then
            echo "Generated StarIntel release is already current."
            exit 0
          fi
          git config user.name "starintel-release-bot"
          git config user.email "starintel-release-bot@users.noreply.github.com"
          git add \
            specs/starintel/0.10.1/generated \
            specs/starintel/0.10.1/release-lock.json \
            specs/starintel/0.10.1/schema-lock-manifest.json
          git commit -m "chore(starintel): regenerate 0.10.1 release artifacts"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Upload generated release
        uses: actions/upload-artifact@v4
        with:
          name: starintel-0.10.1-generated
          if-no-files-found: error
          path: |
            specs/starintel/0.10.1/generated/
            specs/starintel/0.10.1/release-lock.json
            specs/starintel/0.10.1/schema-lock-manifest.json
