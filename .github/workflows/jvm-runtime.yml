name: star-lang JVM runtime

on:
  push:
    branches:
      - main
    paths:
      - "runtime-jvm/**"
      - "starlang-compiler/**"
      - ".github/workflows/jvm-runtime.yml"
  pull_request:
    paths:
      - "runtime-jvm/**"
      - "starlang-compiler/**"
      - ".github/workflows/jvm-runtime.yml"

permissions:
  contents: read

jobs:
  runtime-jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Kotlin/JVM runtime gates
        run: gradle -p runtime-jvm check --no-daemon
