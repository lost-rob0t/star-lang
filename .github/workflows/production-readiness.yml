name: StarLang production readiness

on:
  pull_request:
    paths:
      - "starlang-compiler/**"
      - "starlang-loader/**"
      - "starlang-runtime/**"
      - "star-sento-compat/**"
      - "star-*/**"
      - "ci/check-final-authority.sh"
      - "ci/target-systems.txt"
      - ".github/workflows/production-readiness.yml"
      - "docs/PRODUCTION-READINESS.md"
      - "flake.nix"
  push:
    branches: [main]
    paths:
      - "starlang-compiler/**"
      - "starlang-loader/**"
      - "starlang-runtime/**"
      - "star-sento-compat/**"
      - "star-*/**"
      - "ci/check-final-authority.sh"
      - "ci/target-systems.txt"
      - ".github/workflows/production-readiness.yml"
      - "docs/PRODUCTION-READINESS.md"
      - "flake.nix"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-authority:
    name: Final authority certificate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prove prototype authority is retired
        run: bash ci/check-final-authority.sh
      - name: Prove prototype paths are absent from the Git tree
        shell: bash
        run: |
          set -euo pipefail
          test ! -e starlang-prototype.asd
          test ! -e prototype
          ! git ls-files | grep -Eq '^(prototype/|starlang-prototype\.asd$)'
