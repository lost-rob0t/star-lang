name: StarLang production readiness

on:
  pull_request:
    paths:
      - "prototype/**"
      - "starlang-prototype.asd"
      - "starlang-compiler/**"
      - "starlang-runtime/**"
      - "star-*/**"
      - "ci/prototype-migration.tsv"
      - "ci/check-prototype-migration.sh"
      - ".github/workflows/production-readiness.yml"
      - "docs/PRODUCTION-READINESS.md"
  push:
    branches:
      - main
    paths:
      - "prototype/**"
      - "starlang-prototype.asd"
      - "starlang-compiler/**"
      - "starlang-runtime/**"
      - "star-*/**"
      - "ci/prototype-migration.tsv"
      - "ci/check-prototype-migration.sh"
      - ".github/workflows/production-readiness.yml"
      - "docs/PRODUCTION-READINESS.md"
  workflow_dispatch:
    inputs:
      require_full_port:
        description: Fail unless every prototype implementation is compatibility-only
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  migration-ledger:
    name: Prototype authority ledger
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify every prototype component has one tracked migration state
        run: bash ci/check-prototype-migration.sh
      - name: Enforce full production port
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.require_full_port }}
        run: bash ci/check-prototype-migration.sh --require-final
